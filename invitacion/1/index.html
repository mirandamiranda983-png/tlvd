<!DOCTYPE html>
<html lang="es">
<head>
          <!-- Título que aparecerá en redes -->
<meta property="og:title" content="Culto de Jóvenes - TLVD">
<!-- Descripción que aparecerá debajo del título -->
<meta property="og:description" content="Acuérdate de tu Creador en los días de tu juventud, antes que vengan los días malos, y lleguen los años de los cuales digas: No tengo en ellos contentamiento;
Eclesiastés 12:1">
<!-- URL de la imagen que se mostrará (debe ser una imagen real en tu repo) -->
<meta property="og:image" content="https://tlvd.org/jovenes1.png">
<!-- La URL de tu página -->
<meta property="og:url" content="https://tlvd.org/invitacion/1/">
<!-- Tipo de contenido -->
<meta property="og:type" content="website">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Finalizado - Tabernáculo La Voz de Dios</title>
    <link rel="icon" type="image/png" href="/LOGO LA VOZ DE DIOS.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900/80 backdrop-blur-sm text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Tarjeta Principal -->
    <div class="max-w-md w-full bg-white text-slate-900 rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        
        <!-- Cabecera oscura con el logo centrado y el texto "TABERNÁCULO LA VOZ DE DIOS" -->
        <div class="bg-[#131b24] text-white px-5 py-4 flex flex-col items-center justify-center text-center relative">
            <!-- Botón de cierre en la esquina superior derecha -->
            <a href="https://tlvd.org/" class="absolute right-4 top-4 text-slate-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </a>
            
            <div class="flex items-center space-x-2.5 py-1">
                <img src="https://tlvd.org/LOGO%20LA%20VOZ%20DE%20DIOS.png" alt="Logo" class="h-6 w-auto object-contain">
                <span class="font-bold tracking-wider text-xs uppercase leading-tight text-white">TABERNÁCULO LA VOZ DE DIOS</span>
            </div>
        </div>

        <!-- Contenido central -->
        <div class="p-8 text-center space-y-6">
            
            <!-- Icono central de reloj/evento finalizado -->
            <div class="flex justify-center">
                <div class="w-16 h-16 rounded-full bg-[#fdf8f0] flex items-center justify-center text-[#c5a059]">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- Título -->
            <div class="space-y-2">
                <h2 class="text-xl font-extrabold tracking-tight text-slate-900">¡EVENTO FINALIZADO!</h2>
                <p class="text-slate-600 text-sm leading-relaxed px-2">
                    Este evento ha concluido. Agradecemos mucho tu compañía y participación. Serás redirigido al inicio en breve.
                </p>
            </div>

            <!-- Botón de acción oscuro -->
            <div class="pt-2">
                <a href="https://tlvd.org/" class="w-full block bg-[#131b24] hover:bg-[#1f2b38] text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 shadow-md text-center tracking-wide text-sm">
                    IR AL INICIO AHORA
                </a>
                <p id="countdown-text" class="text-xs text-slate-400 mt-3">Redirigiendo automáticamente en <span id="seconds">7</span> segundos...</p>
            </div>

        </div>

    </div>

    <!-- Script para la redirección con cuenta regresiva -->
    <script>
        let segundosRestantes = 7;
        const spanSegundos = document.getElementById('seconds');

        const intervalo = setInterval(() => {
            segundosRestantes--;
            spanSegundos.textContent = segundosRestantes;
            
            if (segundosRestantes <= 0) {
                clearInterval(intervalo);
                window.location.replace("https://tlvd.org/");
            }
        }, 1000);
    </script>
</body>
</html>
